[package]
name = "ghub-gui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "ghub_gui"
path = "src/lib.rs"

[[bin]]
name = "ghub-gui"
path = "src/main.rs"
test = false
required-features = ["qt"]

[features]
default = ["qt"]
qt = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib", "dep:cxx-qt-build"]
fake-daemon = []

[dependencies]
ghub-ipc = { path = "../ghub-ipc" }
zbus = "5"
zvariant = "5"
serde_json = "1"
cxx = { version = "1", optional = true }
cxx-qt = { version = "=0.10.0", optional = true }
cxx-qt-lib = { version = "=0.10.0", features = ["qt_full"], optional = true }

[build-dependencies]
cxx-qt-build = { version = "=0.10.0", optional = true }
